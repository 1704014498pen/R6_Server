[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "r6-server"
dynamic = ["version"]
description = "레인보우 식스 시즈 서버(DataCenterHint) 선택 GUI"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Environment :: Win32 (MS Windows)",
]

[project.optional-dependencies]
dev = ["pytest", "pyinstaller"]

[project.gui-scripts]
r6-server = "r6_server.gui:main"

[tool.setuptools.dynamic]
version = {attr = "r6_server.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
